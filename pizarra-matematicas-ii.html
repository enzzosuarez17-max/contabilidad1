<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pizarra — Matemáticas II</title><style>:root{--accent:#596b9d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fff;color:#222}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border-bottom:1px solid #ddd;position:sticky;top:0;background:#fff;z-index:2}.bar strong{margin-right:auto}.btn{border:1px solid #ccc;background:#fff;border-radius:9px;padding:8px 11px;font-weight:700;cursor:pointer}.btn.active,.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.wrap{padding:12px}.board{height:75vh;min-height:420px;border:1px solid #ddd;border-radius:14px;overflow:hidden;touch-action:none;background:#fff}.board canvas{width:100%;height:100%;display:block}.status{font-size:12px;color:#666;margin-top:8px}.ok{color:#287a38}.err{color:#b42318}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid #eee}.controls label{font-size:12px;color:#666;font-weight:700}.controls input[type=range]{width:120px}.controls input[type=color]{width:34px;height:28px;padding:2px}.name{padding:6px 8px;border:1px solid #ccc;border-radius:8px;min-width:180px}.link{word-break:break-all}</style></head><body><div class="bar"><strong>✏️ Pizarra — Matemáticas II</strong><button class="btn active" id="pen">✎ Dibujar</button><button class="btn" id="eraser">⌫ Borrador</button><button class="btn" id="undo">↶ Deshacer</button><button class="btn" id="redo">↷ Rehacer</button><button class="btn" id="clear">Limpiar</button><label class="btn">📷 Imagen<input class="upload" id="file" type="file" accept="image/*"></label><button class="btn primary" id="save">💾 Guardar y enviar</button></div><div class="controls"><label>Color <input id="color" type="color" value="#222222"></label><label>Grosor <input id="size" type="range" min="1" max="18" value="3"><span id="sizeVal">3</span> px</label><input id="filename" class="name" placeholder="nombre del ejercicio (opcional)"></div><div class="wrap"><div class="board" id="board"><canvas id="canvas"></canvas></div><div class="status" id="status">Dibujá tu ejercicio. Podés usar mouse, lápiz o dedo.</div></div><script>
const UPLOAD_ENDPOINT='https://contabilidad1.enzzosuarez17.workers.dev/upload';
const board=document.getElementById('board'),c=document.getElementById('canvas'),ctx=c.getContext('2d');let mode='pen',drawing=false,last=[0,0],history=[],future=[];
function resize(){const r=board.getBoundingClientRect(),old=c.width?c.toDataURL():null,d=Math.max(1,devicePixelRatio||1);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);c.style.width=r.width+'px';c.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);ctx.lineCap='round';ctx.lineJoin='round';if(old){const im=new Image;im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=old}}addEventListener('resize',resize);resize();
function pos(e){const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}function snap(){history.push(c.toDataURL());if(history.length>40)history.shift();future=[]}function drawImage(src){const im=new Image;im.onload=()=>{const r=board.getBoundingClientRect();ctx.clearRect(0,0,c.width,c.height);ctx.globalCompositeOperation='source-over';ctx.drawImage(im,0,0,r.width,r.height)};im.src=src}
board.onpointerdown=e=>{snap();drawing=true;board.setPointerCapture(e.pointerId);last=pos(e)};board.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.globalCompositeOperation=mode==='eraser'?'destination-out':'source-over';ctx.strokeStyle=document.getElementById('color').value;ctx.lineWidth=mode==='eraser'?25:+document.getElementById('size').value;ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p};board.onpointerup=()=>drawing=false;board.onpointercancel=()=>drawing=false;
pen.onclick=()=>{mode='pen';pen.classList.add('active');eraser.classList.remove('active')};eraser.onclick=()=>{mode='eraser';eraser.classList.add('active');pen.classList.remove('active')};undo.onclick=()=>{if(!history.length)return;future.push(c.toDataURL());drawImage(history.pop())};redo.onclick=()=>{if(!future.length)return;history.push(c.toDataURL());drawImage(future.pop())};clear.onclick=()=>{if(confirm('¿Limpiar toda la pizarra?')){snap();ctx.clearRect(0,0,c.width,c.height)}};size.oninput=()=>sizeVal.textContent=size.value;
file.onchange=e=>{const f=e.target.files[0];if(!f)return;snap();const im=new Image;im.onload=()=>{const r=board.getBoundingClientRect(),s=Math.min(r.width/im.width,r.height/im.height),w=im.width*s,h=im.height*s;ctx.globalCompositeOperation='source-over';ctx.drawImage(im,(r.width-w)/2,(r.height-h)/2,w,h)};im.src=URL.createObjectURL(f)};
function pngBlob(){return new Promise(resolve=>{const r=board.getBoundingClientRect(),o=document.createElement('canvas');o.width=Math.round(r.width*2);o.height=Math.round(r.height*2);const x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);x.drawImage(c,0,0,o.width,o.height);o.toBlob(resolve,'image/png')})}
save.onclick=async()=>{const status=document.getElementById('status');const blob=await pngBlob();const name=(filename.value.trim()||'ejercicio-matematicas-ii')+'-'+new Date().toISOString().slice(0,10)+'.png';try{status.textContent='Subiendo ejercicio…';const r=await fetch(UPLOAD_ENDPOINT,{method:'POST',headers:{'Content-Type':'image/png','X-Filename':name},body:blob});const text=await r.text();let data={};try{data=JSON.parse(text)}catch{}if(!r.ok)throw new Error(data.error||data.detail||text||('HTTP '+r.status));if(!data.url)throw new Error('El Worker no devolvió una URL de imagen.');status.innerHTML='<span class="ok">✓ Ejercicio enviado.</span> <a class="link" href="'+data.url+'" target="_blank" rel="noopener">Abrir imagen</a>'; }catch(e){console.error(e);status.innerHTML='<span class="err">✗ No se pudo enviar.</span> '+(e.message||'Error desconocido')+'<br>Se descargó el PNG en tu PC como respaldo.';const a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(blob);a.click()}};
</script></body></html>
