<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pizarra Matemáticas II</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#fff;color:#222}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border-bottom:1px solid #ddd;position:sticky;top:0;background:#fff;z-index:2}.bar strong{margin-right:auto}.btn{border:1px solid #ccc;background:#fff;border-radius:9px;padding:8px 11px;font-weight:700;cursor:pointer}.btn.active{background:#596b9d;color:#fff}.wrap{padding:12px}.board{height:75vh;min-height:420px;border:1px solid #ddd;border-radius:14px;overflow:hidden;touch-action:none}.board canvas{width:100%;height:100%;display:block}.status{font-size:12px;color:#666;margin-top:8px}.upload{display:none}.ok{color:#287a38}.err{color:#b42318}</style></head><body><div class="bar"><strong>✏️ Pizarra — Matemáticas II</strong><button class="btn active" id="pen">✎ Dibujar</button><button class="btn" id="eraser">⌫ Borrar</button><button class="btn" id="undo">↶ Deshacer</button><button class="btn" id="clear">Limpiar</button><label class="btn">📷 Imagen<input class="upload" id="file" type="file" accept="image/*"></label><button class="btn" id="save">💾 Guardar PNG</button><button class="btn" id="github">☁️ Guardar en GitHub</button></div><div class="wrap"><div class="board" id="board"><canvas id="canvas"></canvas></div><div class="status" id="status">Dibujá tu ejercicio y guardalo.</div></div><script>
const OWNER='enzzosuarez17-max',REPO='contabilidad1',BRANCH='main',DIR='ejercicios-matematicas-ii';const board=document.getElementById('board'),c=document.getElementById('canvas'),ctx=c.getContext('2d');let mode='pen',drawing=false,last=[0,0],history=[];
function resize(){const r=board.getBoundingClientRect(),old=c.width?c.toDataURL():null,d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;c.style.width=r.width+'px';c.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#222';ctx.lineWidth=3;if(old){let im=new Image;im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=old}}addEventListener('resize',resize);resize();
function pos(e){let r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}function snapshot(){history.push(c.toDataURL());if(history.length>20)history.shift()}board.onpointerdown=e=>{snapshot();drawing=true;board.setPointerCapture(e.pointerId);last=pos(e)};board.onpointermove=e=>{if(!drawing)return;let p=pos(e);ctx.globalCompositeOperation=mode==='eraser'?'destination-out':'source-over';ctx.lineWidth=mode==='eraser'?25:3;ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p};board.onpointerup=()=>drawing=false;board.onpointercancel=()=>drawing=false;
function restore(src){let im=new Image;im.onload=()=>{let r=board.getBoundingClientRect();ctx.clearRect(0,0,c.width,c.height);ctx.globalCompositeOperation='source-over';ctx.drawImage(im,0,0,r.width,r.height)};im.src=src}document.getElementById('undo').onclick=()=>{if(history.length)restore(history.pop())};document.getElementById('pen').onclick=()=>{mode='pen';pen.classList.add('active');eraser.classList.remove('active')};document.getElementById('eraser').onclick=()=>{mode='eraser';eraser.classList.add('active');pen.classList.remove('active')};document.getElementById('clear').onclick=()=>{snapshot();ctx.clearRect(0,0,c.width,c.height)};
document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(!f)return;snapshot();let im=new Image;im.onload=()=>{let r=board.getBoundingClientRect(),s=Math.min(r.width/im.width,r.height/im.height),w=im.width*s,h=im.height*s;ctx.globalCompositeOperation='source-over';ctx.drawImage(im,(r.width-w)/2,(r.height-h)/2,w,h)};im.src=URL.createObjectURL(f)};
function png(){let r=board.getBoundingClientRect(),o=document.createElement('canvas');o.width=r.width*2;o.height=r.height*2;let x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);x.drawImage(c,0,0,o.width,o.height);return o.toDataURL('image/png').split(',')[1]}function name(){let d=new Date,z=n=>String(n).padStart(2,'0');return`${DIR}/${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}_${z(d.getHours())}-${z(d.getMinutes())}-${z(d.getSeconds())}.png`}
async function save(){let b=png(),n=name(),s=document.getElementById('status');s.textContent='Guardando en GitHub...';try{let r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${n}`,{method:'PUT',headers:{Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Guardar ejercicio Matemáticas II',content:b,branch:BRANCH})});let j=await r.json();if(!r.ok)throw Error(j.message||'GitHub no autorizó la escritura');s.innerHTML='<span class="ok">✓ Guardado.</span> El PNG quedó en GitHub.'}catch(e){s.innerHTML='<span class="err">'+e.message+'</span> — Para guardar directamente desde una página pública necesitamos OAuth/backend; no pongas un token en el código. El botón Guardar PNG sigue funcionando.'}}document.getElementById('save').onclick=()=>{let a=document.createElement('a');a.href='data:image/png;base64,'+png();a.download='ejercicio-matematicas-ii.png';a.click()};document.getElementById('github').onclick=save;
</script></body></html>
